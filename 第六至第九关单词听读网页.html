<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>第六至第九关 · 中考英语词汇听读室</title>
  <style>
    :root {
      --ink: #17324d;
      --ink-soft: #5f7385;
      --navy: #142c43;
      --teal: #1e9b8f;
      --teal-soft: #dff5ef;
      --coral: #e97962;
      --yellow: #f6c65b;
      --paper: #fffdf8;
      --cream: #f4f0e8;
      --line: #e5e0d6;
      --shadow: 0 16px 40px rgba(20, 44, 67, .09);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: #f7f4ed;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 280px minmax(0, 1fr); }
    .sidebar {
      position: sticky; top: 0; height: 100vh; overflow: auto;
      padding: 28px 18px 24px; color: #eef8f5; background: var(--navy);
    }
    .brand { padding: 0 12px 24px; border-bottom: 1px solid rgba(255,255,255,.15); }
    .brand-kicker { color: #8fe1d5; font-size: 12px; font-weight: 800; letter-spacing: .18em; }
    .brand h1 { margin: 10px 0 6px; font-size: 24px; line-height: 1.25; letter-spacing: -.03em; }
    .brand p { margin: 0; color: #b8c9d3; font-size: 13px; line-height: 1.7; }
    .directory-title { display: flex; justify-content: space-between; align-items: center; margin: 22px 12px 10px; color: #b8c9d3; font-size: 12px; font-weight: 800; letter-spacing: .1em; }
    .gate-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin: 0 0 12px; }
    .gate-link { padding: 10px 8px; color: #cedde4; border: 1px solid transparent; border-radius: 11px; background: rgba(255,255,255,.06); font-size: 13px; font-weight: 800; }
    .gate-link:hover { color: #fff; background: rgba(255,255,255,.12); }
    .gate-link.active { color: #163046; background: #e6f6f1; border-color: #b8e6db; }
    .gate-subtitle { display: block; margin-top: 3px; color: #8aa5b4; font-size: 10px; font-weight: 500; }
    .active .gate-subtitle { color: var(--teal); }
    .unit-list { display: grid; gap: 6px; }
    .unit-link {
      width: 100%; display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 8px; align-items: center;
      padding: 10px 11px; color: #cedde4; text-align: left; border: 1px solid transparent; border-radius: 12px; background: transparent;
    }
    .unit-link:hover { color: #fff; background: rgba(255,255,255,.08); }
    .unit-link.active { color: #163046; background: #e6f6f1; border-color: #b8e6db; }
    .unit-num { color: #8aa5b4; font: 800 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .active .unit-num { color: var(--teal); }
    .unit-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; }
    .main { min-width: 0; padding: 30px clamp(18px, 4vw, 58px) 58px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 28px; }
    .breadcrumb { color: var(--ink-soft); font-size: 13px; }
    .breadcrumb strong { color: var(--ink); }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .voice-status { display: flex; gap: 7px; align-items: center; color: var(--ink-soft); font-size: 12px; }
    .status-dot { width: 8px; height: 8px; background: var(--teal); border-radius: 99px; }
    .hero {
      position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 28px; align-items: end;
      padding: clamp(25px, 4vw, 44px); color: white; background: var(--navy); border-radius: 26px; box-shadow: var(--shadow);
    }
    .hero:after { content: "Aa"; position: absolute; right: 25px; top: -25px; color: rgba(255,255,255,.08); font: 900 170px/1 Georgia, serif; transform: rotate(-8deg); }
    .eyebrow { position: relative; z-index: 1; color: #8fe1d5; font-size: 12px; font-weight: 850; letter-spacing: .14em; }
    .hero h2 { position: relative; z-index: 1; max-width: 760px; margin: 13px 0 12px; font-size: clamp(30px, 4.5vw, 54px); line-height: 1.05; letter-spacing: -.055em; }
    .hero p { position: relative; z-index: 1; max-width: 630px; margin: 0; color: #bed0d7; line-height: 1.75; }
    .hero-stat { position: relative; z-index: 1; min-width: 150px; padding: 17px 20px; border: 1px solid rgba(255,255,255,.18); border-radius: 18px; background: rgba(255,255,255,.08); }
    .hero-stat strong { display: block; font-size: 34px; letter-spacing: -.06em; }
    .hero-stat span { display: block; margin-top: 4px; color: #c0d2d8; font-size: 12px; }
    .control-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 24px 0; }
    .search-box { flex: 1 1 270px; position: relative; }
    .search-box input { width: 100%; padding: 14px 17px 14px 44px; color: var(--ink); border: 1px solid var(--line); border-radius: 13px; outline: 0; background: var(--paper); box-shadow: 0 6px 18px rgba(20,44,67,.04); }
    .search-box input:focus { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(30,155,143,.12); }
    .search-icon { position: absolute; left: 16px; top: 50%; color: var(--ink-soft); transform: translateY(-50%); }
    .select, .outline-btn { padding: 13px 15px; color: var(--ink); border: 1px solid var(--line); border-radius: 13px; background: var(--paper); }
    .outline-btn:hover { border-color: var(--teal); color: var(--teal); }
    .primary-btn { padding: 13px 17px; color: #fff; border: 0; border-radius: 13px; background: var(--teal); box-shadow: 0 8px 18px rgba(30,155,143,.23); }
    .primary-btn:hover { background: #18877d; }
    .summary { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; margin: 12px 0 18px; }
    .section-title { display: flex; gap: 10px; align-items: baseline; margin: 0; font-size: 22px; letter-spacing: -.03em; }
    .section-title small { color: var(--ink-soft); font-size: 12px; font-weight: 500; letter-spacing: 0; }
    .progress { display: flex; align-items: center; gap: 9px; color: var(--ink-soft); font-size: 12px; }
    .progress-track { width: 128px; height: 7px; overflow: hidden; border-radius: 99px; background: #e4e8e4; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: var(--teal); transition: width .25s ease; }
    .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 14px; }
    .word-card { position: relative; min-height: 180px; display: flex; flex-direction: column; justify-content: space-between; padding: 19px; border: 1px solid var(--line); border-radius: 17px; background: var(--paper); box-shadow: 0 8px 20px rgba(20,44,67,.045); transition: .18s ease; }
    .word-card:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(20,44,67,.09); }
    .word-card.learned { border-color: #a8dfd5; background: #fbfffc; }
    .word-card.learned:before { content: "已掌握"; position: absolute; top: 15px; right: 15px; color: var(--teal); font-size: 11px; font-weight: 800; }
    .word-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .word { margin: 0; font: 800 25px/1.15 Georgia, "Times New Roman", serif; letter-spacing: -.025em; }
    .word-meaning { min-height: 45px; margin: 12px 0 17px; color: #476074; font-size: 14px; line-height: 1.75; }
    .speak-btn { flex: 0 0 auto; width: 38px; height: 38px; color: var(--teal); border: 1px solid #bde5dc; border-radius: 12px; background: var(--teal-soft); font-size: 17px; }
    .speak-btn:hover { color: #fff; background: var(--teal); }
    .card-footer { display: flex; justify-content: space-between; gap: 10px; align-items: center; color: var(--ink-soft); font-size: 11px; }
    .audio-label { display: inline-flex; align-items: center; gap: 5px; }
    .check-btn { color: var(--ink-soft); border: 0; background: transparent; font-size: 12px; }
    .check-btn:hover { color: var(--teal); }
    .empty { grid-column: 1/-1; padding: 55px 20px; color: var(--ink-soft); text-align: center; border: 1px dashed #cdd7d1; border-radius: 17px; background: rgba(255,255,255,.52); }
    .topic-note { margin-top: 27px; padding-top: 21px; color: var(--ink-soft); border-top: 1px solid var(--line); font-size: 12px; line-height: 1.8; }
    .topic-note strong { color: var(--ink); }
    @media (max-width: 860px) {
      .app { display: block; }
      .sidebar { position: static; height: auto; padding: 20px 15px 16px; }
      .brand { display: flex; align-items: center; gap: 16px; padding: 0 7px 17px; }
      .brand h1 { margin: 3px 0; font-size: 20px; }
      .brand p { display: none; }
      .directory-title { margin: 16px 7px 8px; }
      .gate-list { grid-template-columns: repeat(4, minmax(86px,1fr)); margin-bottom: 12px; }
      .unit-list { display: flex; overflow-x: auto; gap: 7px; padding: 0 2px 2px; }
      .unit-link { min-width: 180px; padding: 9px 10px; }
      .main { padding: 20px 15px 40px; }
      .topbar { margin-bottom: 17px; }
      .hero { grid-template-columns: 1fr; gap: 20px; }
      .hero-stat { width: max-content; }
    }
    @media (max-width: 520px) {
      .top-actions { display: none; }
      .word-grid { grid-template-columns: 1fr; }
      .hero h2 { font-size: 36px; }
    }
  </style>
</head>

      else if (raw.includes('/')) parts = raw.split('/');
      else if (raw.includes('=')) parts = raw.split('=');
      else parts = [raw];
      return parts.map(part => part.replace(/[()]/g, ' ').replace(/-/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
    }
    function playBrowserFallback(part) {
      if (!('speechSynthesis' in window)) return Promise.resolve(false);
      return new Promise(resolve => {
        const utter = new SpeechSynthesisUtterance(part); utter.lang = 'en-US'; utter.rate = 1; utter.volume = 1;
        utter.onend = () => resolve(true); utter.onerror = () => resolve(false); speechSynthesis.speak(utter);
      });
    }
    function playYoudaoPart(part) {
      const url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(part)}&type=${state.accent}`;
      const audio = new Audio(url); activeAudio = audio; audio.preload = 'auto'; audio.volume = 1; audio.playbackRate = 1;
      return new Promise(resolve => {
        let done = false;
        const finish = ok => { if (done) return; done = true; if (activeAudio === audio) activeAudio = null; resolve(ok); };
        audio.addEventListener('ended', () => finish(true), { once: true });
        audio.addEventListener('error', async () => { if (activeAudio === audio) activeAudio = null; finish(await playBrowserFallback(part)); }, { once: true });
        audio.play().catch(async () => { if (activeAudio === audio) activeAudio = null; finish(await playBrowserFallback(part)); });
      });
    }
    async function speak(word, continuationToken = null) {
      if (continuationToken === null) playToken += 1;
      if (activeAudio) { activeAudio.pause(); activeAudio.currentTime = 0; activeAudio = null; }
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      const parts = pronunciationParts(word);
      els.voice.textContent = `正在朗读：${parts.join(' · ')}`;
      for (const part of parts) {
        if (continuationToken !== null && continuationToken !== playToken) return false;
        await playYoudaoPart(part);
      }
      els.voice.textContent = '有道词典音频已就绪';
      return true;
    }
    function toggleLearned(id) { state.learned.has(id) ? state.learned.delete(id) : state.learned.add(id); localStorage.setItem('level8-learned', JSON.stringify([...state.learned])); render(); }
    function renderCards(words) {
      if (!words.length) { els.grid.innerHTML = '<div class="empty">没有找到匹配词汇。试试更短的关键词，或切换主题。</div>'; return; }
      els.grid.innerHTML = words.map(w => `<article class="word-card ${state.learned.has(w.id) ? 'learned' : ''}"><div><div class="word-top"><h4 class="word">${w.word}</h4><button class="speak-btn" type="button" data-speak="${w.word}" aria-label="朗读 ${w.word}">🔊</button></div><p class="word-meaning">${w.meaning}</p></div><div class="card-footer"><span class="audio-label">◉ ${w.level.startsWith('A') ? '准确拼读' : '准确朗读'}</span><button class="check-btn" type="button" data-learn="${w.id}">${state.learned.has(w.id) ? '✓ 已掌握' : '标记掌握'}</button></div></article>`).join('');
      els.grid.querySelectorAll('[data-speak]').forEach(btn => btn.addEventListener('click', () => speak(btn.dataset.speak)));
      els.grid.querySelectorAll('[data-learn]').forEach(btn => btn.addEventListener('click', () => toggleLearned(btn.dataset.learn)));
    }
    function render() {
      const words = filteredWords(); const unit = currentUnit(); const gate = currentGate(); const currentTitle = unit ? unit.title : '本关词汇';
      renderDirectory(); els.gateCrumb.textContent = gate.title; els.crumb.textContent = currentTitle; els.heroWordCount.textContent = words.length; els.title.childNodes[0].nodeValue = currentTitle + ' '; els.meta.textContent = `${gate.title} · ${words.length} 词`;
      const total = allWords().length; const learned = allWords().filter(w => state.learned.has(w.id)).length; els.progressText.textContent = `${learned} / ${total} 已掌握`; els.progressFill.style.width = `${total ? learned / total * 100 : 0}%`; els.playAll.textContent = `▶ 播放本主题（${words.length}）`; renderCards(words);
    }
    els.search.addEventListener('input', e => { state.query = e.target.value; render(); }); els.accent.addEventListener('change', e => { state.accent = e.target.value; els.voice.textContent = `已切换为有道${state.accent === '2' ? '美式' : '英式'}音频`; });
    els.playAll.addEventListener('click', async () => { const words = filteredWords(); if (!words.length) return; const token = ++playToken; for (const word of words) { if (token !== playToken) break; await speak(word.word, token); } });
    render();
  </script>
</body>
</html>
